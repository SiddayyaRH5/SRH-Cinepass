spring.application.name=cinepass

# Database credentials are supplied by Render environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinepass}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Conservative settings for a small managed MySQL tier. The pool is allowed
# to start empty so an unavailable database does not prevent liveness startup.
spring.datasource.hikari.pool-name=CinePassHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:15000}
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# The production schema already exists. Do not run automatic DDL against the
# live database during startup; this also avoids schema-update work on wake-up.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Render supplies PORT. Local development defaults to 8080.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Comma-separated exact frontend origins.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}

tmdb.access-token=${TMDB_ACCESS_TOKEN:}
tmdb.sync-key=${TMDB_SYNC_KEY:}

# Bounded in-memory cache for public catalogue data only.
spring.cache.type=caffeine
