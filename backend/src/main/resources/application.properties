spring.application.name=cinepass

# Database credentials must be configured in the Render service environment.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=1

# Bound the driver-level socket work. MySQL Connector/J defaults both values to
# 0 ("wait forever"), so a half-open or silently dropped connection to Aiven can
# leave startup blocked instead of failing. Tomcat only opens PORT after the JPA
# EntityManagerFactory is created, so an unbounded attempt is indistinguishable
# from Render's "No open ports detected" scan timeout. These values do not change
# DB_URL or any credential; they only make a broken connection fail fast with a
# real error in the log.
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Render supplies PORT. Local development defaults to 8080.
# Bind the IPv4 wildcard explicitly. The JVM otherwise chooses the IPv6 wildcard
# (::) on dual-stack hosts, while Render only detects a port listening on
# 0.0.0.0. This does not affect authentication, CORS or any request handling.
server.port=${PORT:8080}
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Comma-separated allowed frontend origins. Keep localhost for local development.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}

# Deployment environment. Set APP_ENV=production on Render so startup
# validation enforces the required production configuration.
app.environment=${APP_ENV:development}

# Razorpay Payment Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Digital ticket configuration. Tokens are generated server-side; these values
# only control QR rendering and the admission window.
app.tickets.qr-size=${TICKET_QR_SIZE:512}
app.tickets.admission-opens-minutes-before=${TICKET_ADMISSION_OPENS_MINUTES:120}
app.tickets.admission-closes-minutes-after=${TICKET_ADMISSION_CLOSES_MINUTES:30}
app.tickets.verify-rate-limit-per-minute=${TICKET_VERIFY_RATE_LIMIT:60}
app.tickets.backfill-on-startup=${TICKET_BACKFILL_ON_STARTUP:true}

# ---------------------------------------------------------------------------
# Daily show automation
#
# All times are IST wall-clock. The scheduler runs EVERY DAY at 2:00 AM IST and
# generates shows for every configured slot at every eligible theatre, for the
# rolling window of `horizon-days` calendar dates starting today. With the
# default of 7 that is today plus the next six dates, which is exactly seven
# dates. It never creates a second show for the same movie + theatre + exact
# showtime, so reruns and multiple instances are safe.
# ---------------------------------------------------------------------------
app.shows.scheduler.enabled=${SHOW_SCHEDULER_ENABLED:true}
app.shows.scheduler.cron=${SHOW_SCHEDULER_CRON:0 0 2 * * *}
app.shows.scheduler.horizon-days=${SHOW_SCHEDULER_HORIZON_DAYS:7}
app.shows.scheduler.min-lead-minutes=${SHOW_SCHEDULER_MIN_LEAD_MINUTES:30}
app.shows.scheduler.movies-per-theatre-per-day=${SHOW_SCHEDULER_MOVIES_PER_THEATRE:4}
app.shows.scheduler.slots=${SHOW_SCHEDULER_SLOTS:10:00,13:30,17:00,20:30}
app.shows.scheduler.base-ticket-price=${SHOW_SCHEDULER_BASE_PRICE:180}
app.shows.scheduler.slot-price-step=${SHOW_SCHEDULER_PRICE_STEP:30}
app.shows.scheduler.lease-minutes=${SHOW_SCHEDULER_LEASE_MINUTES:30}

# Sales stop this many minutes before the show starts. This is separate from
# the post-start expiry rule below.
app.shows.booking.close-minutes-before-start=${SHOW_BOOKING_CLOSE_MINUTES:15}

# Show lifecycle cleanup. Shows are marked EXPIRED (never deleted) once they
# started more than `minutes-after-start` ago. Set 30 for a shorter grace
# period; the default is 45.
app.shows.cleanup.enabled=${SHOW_CLEANUP_ENABLED:true}
app.shows.cleanup.cron=${SHOW_CLEANUP_CRON:0 */10 * * * *}
show.cleanup.minutes-after-start=${SHOW_CLEANUP_MINUTES_AFTER_START:45}

# ---------------------------------------------------------------------------
# TMDB (the only external movie metadata and release provider)
#
# The access token is a backend-only secret. It is read from an environment
# variable, never from a frontend variable, and it is never written to a log
# line. Leave it empty to disable the automatic catalogue synchronisation; the
# rest of the application keeps working.
# ---------------------------------------------------------------------------
tmdb.access.token=${TMDB_ACCESS_TOKEN:}
tmdb.sync-key=${TMDB_SYNC_KEY:}

app.tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
# ISO 3166-1 code of the region whose theatrical releases drive the
# catalogue. This must stay IN for the Indian release rules to apply.
app.tmdb.region=${TMDB_REGION:IN}
app.tmdb.language=${TMDB_LANGUAGE:en-IN}
app.tmdb.connect-timeout-ms=${TMDB_CONNECT_TIMEOUT_MS:5000}
app.tmdb.read-timeout-ms=${TMDB_READ_TIMEOUT_MS:10000}
# How many pages of each discovery list are read per run.
app.tmdb.discovery-max-pages=${TMDB_DISCOVERY_MAX_PAGES:3}
app.tmdb.cache.discovery-ttl-minutes=${TMDB_DISCOVERY_CACHE_MINUTES:30}
app.tmdb.cache.details-ttl-minutes=${TMDB_DETAILS_CACHE_MINUTES:360}

# ---------------------------------------------------------------------------
# Automatic movie catalogue synchronisation
#
# A movie is only imported when TMDB confirms an Indian theatrical release
# date for it. The window below limits how far in the past or in the future a
# newly imported movie may have its Indian theatrical date.
# ---------------------------------------------------------------------------
app.movies.sync.enabled=${MOVIE_SYNC_ENABLED:true}
app.movies.sync.backfill-days=${MOVIE_SYNC_BACKFILL_DAYS:90}
app.movies.sync.lookahead-days=${MOVIE_SYNC_LOOKAHEAD_DAYS:180}

# ---------------------------------------------------------------------------
# Automatic movie retirement
#
# A movie is retired 60 calendar days after its Indian theatrical release
# date. Retirement never deletes anything: the movie row, its shows, bookings,
# tickets, seats and payments are all preserved. A movie with future shows,
# open bookings, an unresolved payment workflow or administrator protection is
# never retired.
# ---------------------------------------------------------------------------
app.movies.lifecycle.retirement-enabled=${MOVIE_RETIREMENT_ENABLED:true}
app.movies.lifecycle.retirement-days=${MOVIE_RETIREMENT_DAYS:30}
