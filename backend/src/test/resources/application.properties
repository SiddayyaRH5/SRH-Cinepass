# Test-only configuration. H2 runs in MySQL compatibility mode so the same
# JPA mappings and locking queries are exercised without a production database.
spring.datasource.url=jdbc:h2:mem:cinepass_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=15000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=test-jwt-secret-with-at-least-32-utf8-bytes
app.frontend-url=http://localhost:5173
app.environment=test

razorpay.key-id=test_key_id
razorpay.key-secret=test_key_secret
razorpay.webhook-secret=test_webhook_secret

app.tickets.qr-size=512
app.tickets.admission-opens-minutes-before=120
app.tickets.admission-closes-minutes-after=30
app.tickets.verify-rate-limit-per-minute=1000
app.tickets.backfill-on-startup=false

# Background jobs are disabled for tests; individual tests invoke the services
# directly with a deterministic clock. The generation service itself is always
# callable, so its knobs are pinned here for deterministic assertions.
app.shows.scheduler.enabled=false
app.shows.scheduler.horizon-days=0
app.shows.scheduler.min-lead-minutes=30
app.shows.scheduler.movies-per-theatre-per-day=4
app.shows.scheduler.slots=10:00,13:30,17:00,20:30
app.shows.cleanup.enabled=false
app.shows.booking.close-minutes-before-start=15
show.cleanup.minutes-after-start=45

demo.seed.enabled=false
