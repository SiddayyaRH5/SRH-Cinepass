spring.application.name=cinepass

# Database credentials must be configured in the Render service environment.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Render supplies PORT. Local development defaults to 8080.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Comma-separated allowed frontend origins. Keep localhost for local development.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}

# Deployment environment. Set APP_ENV=production on Render so startup
# validation enforces the required production configuration.
app.environment=${APP_ENV:development}

# Razorpay Payment Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Digital ticket configuration. Tokens are generated server-side; these values
# only control QR rendering and the admission window.
app.tickets.qr-size=${TICKET_QR_SIZE:512}
app.tickets.admission-opens-minutes-before=${TICKET_ADMISSION_OPENS_MINUTES:120}
app.tickets.admission-closes-minutes-after=${TICKET_ADMISSION_CLOSES_MINUTES:30}
app.tickets.verify-rate-limit-per-minute=${TICKET_VERIFY_RATE_LIMIT:60}
app.tickets.backfill-on-startup=${TICKET_BACKFILL_ON_STARTUP:true}
