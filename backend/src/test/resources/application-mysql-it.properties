# ============================================================
# MySQL / InnoDB Testcontainers profile
#
# Used ONLY by MySqlInnoDbTransactionTests. The datasource URL,
# username and password are injected from the disposable container
# through @DynamicPropertySource; nothing here points at a real
# database or production credentials.
#
# Hibernate generates the schema into the disposable container.
# This is a MySQL/InnoDB TRANSACTION test baseline, NOT migration
# validation. Migrations 001/002 are additive and incomplete and
# cannot create a fresh database (see Phase 9B report / Phase 9C).
# ============================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
